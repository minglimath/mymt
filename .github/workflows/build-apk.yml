name: Build Patched APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK_NAME: "mt2264"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download uber-apk-signer
        run: |
          wget -q "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -O uber-apk-signer.jar

      - name: Decompile APK
        run: |
          # -r 参数：不反编译资源文件
          java -jar apktool_2.9.3.jar d "${APK_NAME}.apk" -o "${APK_NAME}" -f -r
          echo "Decompiled ${APK_NAME}.apk -> ${APK_NAME}/ (without resources)"

      - name: Apply patches
        run: |
          cp -rv patches/ "${APK_NAME}/"
          echo "Patches applied."

      - name: Rebuild APK
        run: |
          java -jar apktool_2.9.3.jar b "${APK_NAME}" -o "${APK_NAME}_patched.apk"

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks "${APK_NAME}_patched.apk" --allowResign --overwrite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: "*_patched-aligned-debugSigned.apk"
          # 可选：保留天数，默认90天
          retention-days: 7
