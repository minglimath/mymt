name: Build Patched APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Download uber-apk-signer
        run: |
          # 仅下载签名工具，apktool 使用项目自带的
          wget -q "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -O uber-apk-signer.jar

      - name: Decompile APK
        run: |
          # 检查项目自带的 apktool 和 mt2264.apk 是否在根目录
          if [ ! -f "apktool_2.9.3.jar" ]; then
            echo "错误：在仓库根目录找不到 apktool_2.9.3.jar！请确认它在正确的位置。"
            exit 1
          fi
          if [ ! -f "mt2264.apk" ]; then
            echo "错误：在仓库根目录找不到 mt2264.apk！"
            exit 1
          fi
          
          # 修正参数顺序：把 -r 放到前面，确保 100% 忽略资源解压
          java -jar apktool_2.9.3.jar d -r mt2264.apk -o mt2264 -f
          echo "Decompiled mt2264.apk -> mt2264/ (Skipped resources)"

      - name: Apply patches
        run: |
          if [ -d "patches" ]; then
            cp -rv patches/ mt2264/
            echo "Patches applied."
          else
            echo "警告：未找到 patches 文件夹，跳过覆盖。"
          fi

      - name: Rebuild APK
        run: |
          java -jar apktool_2.9.3.jar b mt2264 -o mt2264_patched.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar --apks mt2264_patched.apk --allowResign --overwrite
          echo "=== 检查最终生成的文件 ==="
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: |
            mt2264_patched-aligned-debugSigned.apk
            mt2264_patched.apk
          retention-days: 7
